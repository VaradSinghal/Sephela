[project]
name = "sephela-ai"
version = "0.1.0"
description = "Sephela GenAI subsystem — multi-agent LangGraph orchestration, risk scoring, and RAG"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "langgraph>=0.2",
    "typing-extensions>=4.11",
]

[project.optional-dependencies]
# Tracing is optional: ai/ degrades to no-op spans when OTel is absent.
otel = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Build output is a copy of the source; linting it double-reports every finding.
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
# Kept in step with backend/pyproject.toml — see the reasoning there. In short:
# TC00x would hide imports that Pydantic and SQLAlchemy resolve at runtime, and
# UP042's StrEnum swap changes what str() returns on enums that are serialised into
# JSON payloads and Postgres enum columns.
ignore = [
    "TC001",
    "TC002",
    "TC003",
    "UP042",
    # UP046 wants the PEP 695 form (`class BaseAgent[T]`) instead of `Generic[T]`.
    # Purely syntactic, and it rewrites the type contract every agent subclasses —
    # not worth the blast radius for no behavioural gain.
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
# These modules are mostly prompt bodies held in triple-quoted strings. Whitespace
# inside a prompt is part of what the model receives, so reflowing a long line to
# satisfy E501 edits the payload — the same reason applied migrations are exempt in
# backend/pyproject.toml. Long lines in the *code* around the prompts are still
# worth avoiding; the linter cannot tell the two apart, so this is a judgement the
# reviewer keeps rather than one the gate makes.
"prompts/**/*.py" = ["E501"]
"agents/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# The import package must stay `ai` (every import in the repo says `from ai...`)
# while pyproject.toml lives inside ai/ like every other component's.
#
# Hence the explicit map rather than `packages.find(where="..")`: pointing find at
# the parent makes setuptools write an editable .pth containing the *repo root*,
# which puts `backend`, `docs`, and `frontend` on sys.path for anything that
# installs this package. Mapping `ai` to this directory keeps the install scoped to
# the one package, matching how engines/* install.
#
# Packages are listed explicitly because find() cannot express "these directories
# are subpackages of ai" from inside ai/. A new subpackage must be added here.
[tool.setuptools]
package-dir = {"ai" = "."}
# Prompt bodies and the RAG corpus are Markdown read from disk at runtime
# (ai/prompts/prompt_manager.py, ai/rag/ingest.py), not Python. Without this an
# installed copy has the code and none of its content: prompt lookups fail and the
# knowledge service silently ingests an empty corpus.
include-package-data = true
packages = [
    "ai",
    "ai.agents",
    "ai.llm",
    "ai.orchestration",
    "ai.prompts",
    "ai.prompts.shared",
    "ai.rag",
    "ai.schemas",
    "ai.scoring",
    "ai.validation",
]

[tool.setuptools.package-data]
# Globs are relative to each package's directory.
"ai.prompts" = ["*.md"]
"ai.rag" = ["knowledge/**/*.md"]
