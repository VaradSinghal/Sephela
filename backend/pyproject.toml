[project]
name = "sephela-backend"
version = "0.1.0"
description = "Sephela API Gateway / Core Service — FastAPI backend foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "structlog>=24.1",
    # PyJWT, not python-jose: python-jose pulls `ecdsa`, which carries an
    # unfixable Minerva timing CVE (PYSEC-2026-1325) that upstream considers out
    # of scope, and python-jose itself has been unreleased since 3.3.0 (2021).
    # PyJWT signs via `cryptography` and needs neither `ecdsa` nor `rsa`.
    "pyjwt[crypto]>=2.8",
    # Security floor on a transitive dep, which is not otherwise expressible.
    # cryptography < 50.0.0 -> PYSEC-2026-3552. `make security-scan` gates on it.
    "cryptography>=50.0.0",
    # bcrypt directly rather than via passlib: passlib 1.7.4 (2020) reads
    # bcrypt.__about__ during backend detection, which bcrypt >= 4.1 removed, so the
    # combination raises on every hash. passlib is unmaintained; bcrypt is the actual
    # implementation and its API is small enough not to need a wrapper.
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    # boto3 rather than aioboto3: app/storage/s3.py wraps the sync client in
    # asyncio.to_thread, which is the pattern LocalStorage already uses, and avoids a
    # second async HTTP stack for the sake of one module.
    "boto3>=1.34",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-celery>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "testcontainers>=4.5",
    "import-linter>=2.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "schemathesis>=3.29",
    # In-process S3 for the storage tests — no network, no credentials, no MinIO
    # container in CI.
    "moto[s3]>=5.0",
]
# Analysis engines are separate distributions under engines/. Workers that run a
# given stage need its engine installed; the API process does not. Install from
# the repo root, e.g. `make install-engines` or:
#   pip install -e engines/dynamic
engines = [
    "sephela-dynamic-engine",
    "sephela-threat-intel-engine",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Build output is a copy of the source; linting it double-reports every finding.
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
ignore = [
    # TC001/2/3 want type-only imports moved into `if TYPE_CHECKING`. That is wrong
    # for this codebase: SQLAlchemy resolves `Mapped[uuid.UUID]` and Pydantic
    # resolves field annotations *at runtime*, so hiding those imports turns a
    # passing lint into a NameError at mapper configuration time. The rule cannot
    # distinguish an annotation the runtime reads from one it does not, so following
    # it here trades a real breakage for a cosmetic win.
    "TC001",
    "TC002",
    "TC003",
    # UP042 wants `class X(str, Enum)` replaced with `StrEnum`. The two differ in
    # `str()`: StrEnum returns the value, the mixin returns "Class.member". These
    # enums are serialised into JSON payloads and Postgres enum columns, so the
    # swap is a behaviour change disguised as a modernisation.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# `file: UploadFile = File(...)` is the documented FastAPI idiom for declaring a
# multipart parameter; B008 flags the call in the default, which is the point of it.
"app/api/v1/routers/*.py" = ["B008"]
# An applied migration is a historical record of a schema change. Autogenerated
# column definitions routinely run long, and reflowing a migration that has already
# run against real databases is churn with a non-zero chance of altering it.
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# The overrides below are all the same problem: a dependency ships no type
# information, so `strict` flags our correct call sites for the library's silence.
# They are scoped per-module rather than relaxed globally, so a genuinely untyped
# path elsewhere in the codebase still fails the gate.

[[tool.mypy.overrides]]
# Celery's task decorator is untyped, which makes every task function it wraps
# "untyped" in mypy's view. Nothing about the task bodies is unchecked — only the
# decorator's own signature is missing.
module = "app.tasks.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# structlog's get_logger, redis.asyncio.from_url, and the dynamically imported
# engine entrypoints all return Any. Our annotations narrow them correctly; there is
# nothing to fix in this code, and casting at each site would only hide the same gap
# less visibly.
module = [
    "app.core.logging",
    "app.core.redis",
    "app.services.threat_intel",
]
warn_return_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tasks/celery_app.py", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert is fine in non-production code

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
