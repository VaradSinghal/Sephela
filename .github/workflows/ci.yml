# Sephela CI — lint, type, test, security, contracts
# Runs on every push to main and on all pull requests.
# Gates: all jobs must pass before merge (configure branch protection to require this).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────
  # Backend: lint + format check
  # ──────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Ruff check (lint)
        run: cd backend && ruff check .
      - name: Ruff format (check)
        run: cd backend && ruff format --check .

  # ──────────────────────────────────────────────
  # Backend: type checking (mypy --strict)
  # ──────────────────────────────────────────────
  backend-type:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: mypy --strict
        run: cd backend && mypy app

  # ──────────────────────────────────────────────
  # Backend: unit tests + coverage floor
  # ──────────────────────────────────────────────
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sephela
          POSTGRES_PASSWORD: sephela
          POSTGRES_DB: sephela
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sephela"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SEPHELA_POSTGRES_HOST: localhost
      SEPHELA_REDIS_HOST: localhost
      SEPHELA_ENV: local
      SEPHELA_LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
          # app.tasks.ai imports the `ai` package, so collection fails without it.
          pip install -e ../ai
      - name: Run tests with coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ──────────────────────────────────────────────
  # Backend: security scanning
  # ──────────────────────────────────────────────
  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Bandit (static security analysis)
        run: cd backend && bandit -r app/ -c pyproject.toml -f json -o bandit-report.json || true
      - name: Bandit (check for high/critical)
        run: cd backend && bandit -r app/ -c pyproject.toml -ll
      - name: pip-audit (dependency vulnerabilities)
        run: cd backend && pip-audit
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: backend/bandit-report.json

  # ──────────────────────────────────────────────
  # Backend: import boundary enforcement
  # ──────────────────────────────────────────────
  backend-import-lint:
    name: Import Boundary Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
          pip install -e ../engines/static
          pip install -e ../engines/dynamic
          pip install -e ../engines/threat_intel
          pip install -e ../engines/code_intel
          pip install -e ../engines/reporting
          pip install -e ../ai
      - name: lint-imports
        run: cd backend && lint-imports

  # ──────────────────────────────────────────────
  # Engine test suites
  # ──────────────────────────────────────────────
  engine-tests:
    name: Engine Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [static, dynamic, threat_intel, code_intel, reporting]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install engine
        run: |
          cd engines/${{ matrix.engine }}
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          cd engines/${{ matrix.engine }}
          pytest

  # ──────────────────────────────────────────────
  # Infrastructure manifests (structure + security posture; no cluster)
  # ──────────────────────────────────────────────
  infra-validate:
    name: K8s Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
          pip install -e ../ai pyyaml
      # Catches a Deployment whose selector misses its own pods, a dangling
      # ConfigMap reference, a KEDA trigger reading a secret key nobody provides,
      # or a container that lost its security context. Not a substitute for
      # `kubectl apply --dry-run=server`, which needs a cluster.
      - name: Validate manifests
        run: cd backend && pytest tests/test_k8s_manifests.py -v
      - name: Shell-check the deploy script
        run: bash -n infra/k8s/deploy.sh

  # ──────────────────────────────────────────────
  # GenAI subsystem: multi-agent orchestration, scoring, RAG
  # ──────────────────────────────────────────────
  ai-tests:
    name: AI Subsystem Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the AI subsystem
        run: pip install -e "./ai[dev]"
      - name: Ruff check (lint)
        run: cd ai && ruff check .
      - name: Ruff format (check)
        run: cd ai && ruff format --check .
      - name: Run tests
        run: pytest ai/tests

  # ──────────────────────────────────────────────
  # Frontend: lint + type-check + format
  # ──────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: ESLint
        run: cd frontend && npm run lint
      - name: TypeScript type check
        run: cd frontend && npm run typecheck
      - name: Prettier format check
        run: cd frontend && npx prettier --check "src/**/*.{ts,tsx,css,json}"
