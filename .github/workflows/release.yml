# Sephela delivery pipeline — build, attest, scan, sign, deploy.
#
# Split from ci.yml deliberately. CI answers "is this change correct?" and must run
# on every PR including forks. This workflow answers "should this artifact exist and
# where should it run?", needs registry and cluster credentials, and therefore must
# never be triggered by a fork's pull request.
#
# The ordering is the security property: an image is built, then scanned, then
# signed, and only a *signed* digest is deployed. Signing before scanning would
# attest to an image nobody had checked; deploying a tag rather than a digest would
# let a later force-push swap the contents out from under the signature.
#
#   build+push (by digest) → SBOM + attest → scan (blocking) → sign → deploy dev
#                                                                  → staging (on main)
#                                                                  → prod (manual approval)
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, staging, prod]
        default: dev

concurrency:
  # Never let two deploys of the same ref race; do not cancel a deploy in flight,
  # because a half-applied rollout is worse than a queued one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ──────────────────────────────────────────────
  # Build and push by digest
  # ──────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # required for keyless cosign signing
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          # Repo root, not backend/ — the image installs backend/, the engines, and
          # the ai/ package (see backend/Dockerfile).
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Reproducibility: strips build timestamps so an identical source tree
          # produces an identical digest.
          provenance: mode=max
          sbom: true

      # Verifies the image can actually start before anything downstream trusts it.
      # A missing runtime dependency (the `ai` package, a prompt template) shows up
      # here rather than as a CrashLoopBackOff in a cluster.
      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint python \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            -c "
          import importlib
          for module in ('app.main', 'app.tasks.pipeline', 'ai.integration'):
              importlib.import_module(module)
          from pathlib import Path
          import ai.prompts
          prompts = list(Path(ai.prompts.__file__).parent.glob('*_prompt.md'))
          assert len(prompts) == 8, f'expected 8 prompt templates, found {len(prompts)}'
          print('image smoke test passed')
          "

  # ──────────────────────────────────────────────
  # Supply chain: SBOM + vulnerability scan
  # ──────────────────────────────────────────────
  supply-chain:
    name: SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: spdx-json
          artifact-name: sephela-backend-sbom.spdx.json

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          # Blocking on CRITICAL/HIGH only. Including MEDIUM makes the gate fire
          # constantly on unfixable base-image noise, and a gate that is routinely
          # overridden stops being a gate.
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload scan results
        if: always()   # publish findings even when the gate above failed
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  # ──────────────────────────────────────────────
  # Sign the scanned digest
  # ──────────────────────────────────────────────
  sign:
    name: Sign Image
    runs-on: ubuntu-latest
    needs: [build, supply-chain]   # only a scanned image gets signed
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless (OIDC): the signature is bound to this workflow's identity, so there
      # is no long-lived signing key to steal or rotate.
      - name: Sign the digest
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}

      - name: Verify the signature we just made
        # Catches a misconfigured identity now rather than at admission time, where
        # it presents as an unexplained ImagePullBackOff.
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}

  # ──────────────────────────────────────────────
  # Deploy
  # ──────────────────────────────────────────────
  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    needs: sign
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Apply the dev overlay
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_DEV }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: ./infra/k8s/deploy.sh dev "$DIGEST"

  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: [sign, deploy-dev]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Apply the staging overlay
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_STAGING }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: ./infra/k8s/deploy.sh staging "$DIGEST"

  deploy-prod:
    name: Deploy → prod
    runs-on: ubuntu-latest
    needs: [sign, deploy-staging]
    # Only from a version tag, and the `prod` GitHub Environment must carry a
    # required-reviewer rule — the approval gate lives there, not in this file, so it
    # cannot be removed by editing the workflow.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Apply the prod overlay
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PROD }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: ./infra/k8s/deploy.sh prod "$DIGEST"
