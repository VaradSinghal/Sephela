apiVersion: v1
kind: Namespace
metadata:
  name: sephela
  labels:
    app.kubernetes.io/name: sephela
    # Pod Security Admission at `restricted` is the whole point of this file: it
    # rejects privileged pods, host mounts, and root containers at admission time
    # rather than trusting every future manifest to set securityContext correctly.
    # A platform that runs malware cannot rely on reviewer diligence for that.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: sephela-sandbox
  labels:
    app.kubernetes.io/name: sephela-sandbox
    # The dynamic-analysis pool lives in its own namespace so its NetworkPolicies,
    # quotas, and node affinity cannot be widened by a change to the main namespace.
    # It is deliberately NOT `restricted`: the emulator needs /dev/kvm, which
    # requires a privileged-ish context. That exemption is the reason for the
    # separate namespace, the dedicated node pool, and the deny-all egress policy.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
