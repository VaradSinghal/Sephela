# Local full-stack for Sephela.
# Brings up Postgres, Redis, Qdrant, the API, and a Celery worker.
# Object storage (MinIO) is added in its phase.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sephela
      POSTGRES_PASSWORD: sephela
      POSTGRES_DB: sephela
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sephela"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Vector DB for the RAG knowledge service (Phase 12). Optional: the AI layer
  # defaults to its in-memory store, which is adequate for a curated corpus of a
  # few thousand chunks. Set RAG_VECTOR_BACKEND=qdrant to use this instead.
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # Qdrant's image has no curl/wget; its own CLI can probe the local service.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      # Repo root: the image installs backend/ plus the engines/ distributions.
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      SEPHELA_ENV: local
      SEPHELA_POSTGRES_HOST: postgres
      SEPHELA_REDIS_HOST: redis
      SEPHELA_LOG_JSON: "false"
    env_file:
      - ../../.env
    volumes:
      - appdata:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      SEPHELA_ENV: local
      SEPHELA_POSTGRES_HOST: postgres
      SEPHELA_REDIS_HOST: redis
      SEPHELA_LOG_JSON: "false"
    env_file:
      - ../../.env
    volumes:
      - appdata:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app.celery_app worker
      --loglevel=INFO
      --queues=intake,static,code_intel,ai,dynamic,threat_intel,scoring,reporting,notify

  frontend:
    # Dev server rather than a production build: this compose file is the local
    # stack, and the dashboard is the surface you iterate on most.
    image: node:20-alpine
    working_dir: /app
    environment:
      # The Next rewrite proxies /api/* here, so the browser stays same-origin and
      # no CORS configuration is needed (see frontend/next.config.mjs).
      BACKEND_URL: http://api:8000
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
  qdrantdata:
  appdata:
  # Kept out of the bind mount so the container's install does not fight a host
  # node_modules built for a different platform.
  frontend_node_modules: